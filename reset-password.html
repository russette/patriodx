<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>PATRIODX | Reset Password</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            padding: 20px;
        }

        .auth-container {
            width: 100%;
            max-width: 430px;
        }

        .brand {
            text-align: center;
            margin-bottom: 25px;
        }

        .brand img {
            width: 80px;
            height: 80px;
            object-fit: contain;
            border-radius: 18px;
            margin-bottom: 10px;
        }

        .brand h1 {
            margin: 0;
            font-size: 28px;
        }

        .brand p {
            margin-top: 8px;
            color: #666;
        }

        .auth-card {
            background: white;
            padding: 30px;
            border-radius: 18px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.08);
        }

        .auth-card h2 {
            margin-top: 0;
        }

        .description {
            color: #666;
            line-height: 1.5;
            margin-bottom: 22px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: 600;
        }

        .password-wrapper {
            position: relative;
        }

        input {
            width: 100%;
            padding: 13px;
            padding-right: 75px;
            border: 1px solid #d8dce5;
            border-radius: 10px;
            font-size: 15px;
        }

        .show-button {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            width: auto;
            padding: 5px;
            background: none;
            color: #111827;
            font-size: 13px;
        }

        .update-button {
            width: 100%;
            padding: 14px;
            border: 0;
            border-radius: 10px;
            background: #111827;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        .update-button:hover {
            opacity: 0.9;
        }

        #message {
            margin-bottom: 15px;
            padding: 12px;
            border-radius: 8px;
            display: none;
        }

        .success {
            background: #e8f7ed;
            color: #176b35;
        }

        .error {
            background: #fdecec;
            color: #a11a1a;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #111827;
            text-decoration: none;
        }

    </style>

</head>


<body>

<div class="auth-container">

    <div class="brand">

        <img
            src="assets/patriodx-logo.jpeg"
            alt="PATRIODX"
        >

        <h1>PATRIODX</h1>

        <p>Run your business smarter.</p>

    </div>


    <div class="auth-card">

        <h2>Reset Password</h2>

        <p class="description">
            Enter a new password for your PATRIODX account.
        </p>


        <div id="message"></div>


        <form id="resetForm">

            <div class="form-group">

                <label for="password">
                    New Password
                </label>

                <div class="password-wrapper">

                    <input
                        type="password"
                        id="password"
                        placeholder="Minimum 6 characters"
                        minlength="6"
                        required
                    >

                    <button
                        type="button"
                        class="show-button"
                        onclick="togglePassword('password', this)"
                    >
                        Show
                    </button>

                </div>

            </div>


            <div class="form-group">

                <label for="confirmPassword">
                    Confirm New Password
                </label>

                <div class="password-wrapper">

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Enter password again"
                        minlength="6"
                        required
                    >

                    <button
                        type="button"
                        class="show-button"
                        onclick="togglePassword('confirmPassword', this)"
                    >
                        Show
                    </button>

                </div>

            </div>


            <button
                type="submit"
                class="update-button"
                id="updateButton"
            >
                Update Password
            </button>

        </form>


        <a
            href="auth.html"
            class="back-link"
        >
            Back to Sign In
        </a>

    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

const SUPABASE_URL =
    "https://saerujjsfzyxkyacbvgr.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_l50YIYtYLXkjWE1iQSTyoA_GkrIKWn7";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


const form =
    document.getElementById("resetForm");

const updateButton =
    document.getElementById("updateButton");

const message =
    document.getElementById("message");


function showMessage(text, type) {

    message.textContent = text;

    message.className = type;

    message.style.display = "block";

}


function togglePassword(inputId, button) {

    const input =
        document.getElementById(inputId);

    if (input.type === "password") {

        input.type = "text";

        button.textContent = "Hide";

    } else {

        input.type = "password";

        button.textContent = "Show";

    }

}


async function checkRecoverySession() {

    const { data, error } =
        await supabaseClient.auth.getSession();


    if (error) {

        showMessage(
            "Unable to verify the password reset session.",
            "error"
        );

        return false;

    }


    if (!data.session) {

        showMessage(
            "This password reset link is invalid or has expired. Please request a new reset email.",
            "error"
        );

        updateButton.disabled = true;

        return false;

    }


    return true;

}


form.addEventListener("submit", async (event) => {

    event.preventDefault();


    const password =
        document.getElementById("password").value;

    const confirmPassword =
        document.getElementById("confirmPassword").value;


    if (password.length < 6) {

        showMessage(
            "Password must be at least 6 characters.",
            "error"
        );

        return;

    }


    if (password !== confirmPassword) {

        showMessage(
            "Passwords do not match.",
            "error"
        );

        return;

    }


    updateButton.disabled = true;

    updateButton.textContent = "Updating...";


    try {

        const hasSession =
            await checkRecoverySession();


        if (!hasSession) {

            return;

        }


        const { error } =
            await supabaseClient.auth.updateUser({
                password: password
            });


        if (error) {

            throw error;

        }


        showMessage(
            "Password updated successfully. Redirecting to sign in...",
            "success"
        );


        setTimeout(() => {

            window.location.href = "auth.html";

        }, 2000);


    } catch (error) {

        showMessage(
            error.message ||
            "Unable to update password.",
            "error"
        );


    } finally {

        updateButton.disabled = false;

        updateButton.textContent =
            "Update Password";

    }

});


checkRecoverySession();

</script>

</body>

</html>
