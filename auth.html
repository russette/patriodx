<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PATRIODX | Sign In</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            padding: 20px;
        }

        .auth-container {
            width: 100%;
            max-width: 430px;
        }

        .brand {
            text-align: center;
            margin-bottom: 25px;
        }
.brand img {
    display: block;
    width: 150px;
    height: 110px;
    max-width: 100%;
    object-fit: contain;
    margin: 0 auto;
    border-radius: 0;
}
.brand {
    text-align: center;
    margin-bottom: 25px;
}

        .brand p {
            margin-top: 8px;
            color: #666;
        }

        .auth-card {
            background: white;
            padding: 30px;
            border-radius: 18px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.08);
        }

        .auth-card h2 {
            margin-top: 0;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #d8dce5;
            border-radius: 10px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 14px;
            border: 0;
            border-radius: 10px;
            background: #111827;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .switch {
            text-align: center;
            margin-top: 20px;
            color: #666;
        }

        .switch button {
            width: auto;
            padding: 0;
            background: none;
            color: #111827;
            font-size: inherit;
        }

        .forgot {
            text-align: right;
            margin-top: -8px;
            margin-bottom: 18px;
        }

        .forgot button {
            width: auto;
            padding: 0;
            background: none;
            color: #111827;
            font-size: 14px;
        }

        #message {
            margin-bottom: 15px;
            padding: 12px;
            border-radius: 8px;
            display: none;
        }

        .success {
            background: #e8f7ed;
            color: #176b35;
        }

        .error {
            background: #fdecec;
            color: #a11a1a;
        }
        /* PATRIODX — SIGNUP PROFILE SETUP */

#authForm textarea {
    width: 100%;
    padding: 13px;
    border: 1px solid #d8dce5;
    border-radius: 10px;
    font: inherit;
    font-size: 15px;
    resize: vertical;
}

#authForm small {
    display: block;
    margin-top: 7px;
    color: #778195;
    font-size: 12px;
}

.signup-avatar-picker {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-top: 10px;
}

#signupAvatarPreview,
#signupAvatarPlaceholder {
    width: 76px;
    height: 76px;
    border-radius: 50%;
    object-fit: cover;
    background: #eef0f5;
}

#signupAvatarPlaceholder {
    display: grid;
    place-items: center;
    color: #667085;
    font-size: 28px;
}

#signupAvatarPreview[hidden] {
    display: none;
}

.signup-avatar-button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 11px 16px;
    border-radius: 9px;
    background: #eef2ff;
    color: #4338ca;
    font-weight: 600;
    cursor: pointer;
}

#authForm input:focus,
#authForm textarea:focus {
    outline: none;
    border-color: #6366f1;
    box-shadow: 0 0 0 3px rgba(99, 102, 241, .12);
}

@media (max-width: 480px) {
    .auth-card {
        padding: 22px;
    }
}
    </style>

</head>

<body>

<div class="auth-container">

   <div class="brand">
    <img
        src="assets/patriodx-logo-transparent.png"
        alt="PATRIODX"
    >
</div>
    <div class="auth-card">

        <h2 id="formTitle">Sign In</h2>

        <div id="message"></div>

        <form id="authForm">

<!-- FULL NAME -->
<div class="form-group" id="nameGroup" style="display:none;">
    <label for="name">Full name</label>
    <input
        type="text"
        id="name"
        placeholder="Your full name"
        autocomplete="name"
        maxlength="80"
        required
    >
</div>

<!-- USERNAME -->
<div class="form-group" id="usernameGroup" style="display:none;">
    <label for="username">Username</label>
    <input
        type="text"
        id="username"
        placeholder="@yourusername"
        minlength="3"
        maxlength="30"
        autocomplete="username"
    >
    <small>Letters, numbers and underscores only.</small>
</div>

<!-- BIO -->
<div class="form-group" id="bioGroup" style="display:none;">
    <label for="signupBio">Bio</label>
    <textarea
        id="signupBio"
        placeholder="Tell people about yourself..."
        maxlength="160"
        rows="3"
    ></textarea>
    <small>Maximum 160 characters.</small>
</div>

<!-- PROFILE PHOTO -->
<div class="form-group" id="avatarGroup" style="display:none;">
    <label>Profile photo</label>

    <div class="signup-avatar-picker">
        <img
            id="signupAvatarPreview"
            alt="Profile photo preview"
            hidden
        >

        <div id="signupAvatarPlaceholder">
            <i data-lucide="user-round"></i>
        </div>

        <label for="signupAvatar" class="signup-avatar-button">
            Choose photo
        </label>
    </div>

    <input
        type="file"
        id="signupAvatar"
        accept="image/jpeg,image/png,image/webp"
        hidden
    >

    <small>JPG, PNG or WEBP. Maximum 1.5 MB.</small>
</div>

            <div class="form-group" id="emailGroup">
                <label for="email">Email</label>

                <input
                    type="email"
                    id="email"
                    placeholder="you@example.com"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password" id="passwordLabel">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Minimum 6 characters"
                    minlength="6"
                    required
                >
            </div>

            <div class="forgot" id="forgotGroup">
                <button type="button" id="forgotButton">
                    Forgot Password?
                </button>
            </div>

            <button type="submit" id="submitButton">
                Sign In
            </button>
        </form>

        <div class="switch" id="switchArea">
            <span id="switchText">
                Don't have an account?
            </span>

            <button type="button" id="switchButton">
                Create Account
            </button>
        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
    "https://saerujjsfzyxkyacbvgr.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_l50YIYtYLXkjWE1iQSTyoA_GkrIKWn7";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


let isSignUp = false;
let isResetting = false;


const form =
    document.getElementById("authForm");

const formTitle =
    document.getElementById("formTitle");

const submitButton =
    document.getElementById("submitButton");

const switchButton =
    document.getElementById("switchButton");

const switchText =
    document.getElementById("switchText");

const switchArea =
    document.getElementById("switchArea");

const nameGroup =
    document.getElementById("nameGroup");
const usernameGroup =
    document.getElementById("usernameGroup");

const usernameInput =
    document.getElementById("username");
    const bioGroup = document.getElementById("bioGroup");
const avatarGroup = document.getElementById("avatarGroup");
const bioInput = document.getElementById("signupBio");
const avatarInput = document.getElementById("signupAvatar");
const avatarPreview = document.getElementById("signupAvatarPreview");
const avatarPlaceholder = document.getElementById("signupAvatarPlaceholder");

let signupAvatarData = "";
const emailGroup =
    document.getElementById("emailGroup");

const passwordLabel =
    document.getElementById("passwordLabel");

const passwordInput =
    document.getElementById("password");

const forgotGroup =
    document.getElementById("forgotGroup");

const forgotButton =
    document.getElementById("forgotButton");

const message =
    document.getElementById("message");

avatarInput.addEventListener("change", () => {
    const file = avatarInput.files[0];

    if (!file) return;

    const allowedTypes = [
        "image/jpeg",
        "image/png",
        "image/webp"
    ];

    if (!allowedTypes.includes(file.type)) {
        showMessage("Choose a JPG, PNG, or WEBP image.", "error");
        avatarInput.value = "";
        return;
    }

    if (file.size > 1.5 * 1024 * 1024) {
        showMessage("Your profile photo must be smaller than 1.5 MB.", "error");
        avatarInput.value = "";
        return;
    }

    const reader = new FileReader();

    reader.onload = () => {
        signupAvatarData = reader.result;
        avatarPreview.src = signupAvatarData;
        avatarPreview.hidden = false;
        avatarPlaceholder.style.display = "none";
    };

    reader.onerror = () => {
        showMessage("Could not read that image. Please try another.", "error");
    };

    reader.readAsDataURL(file);
});
function showMessage(text, type) {

    message.textContent = text;

    message.className = type;

    message.style.display = "block";

}


function showResetForm() {

    isResetting = true;
    isSignUp = false;


    formTitle.textContent =
        "Reset Password";


    emailGroup.style.display =
        "none";


    nameGroup.style.display =
        "none";
usernameGroup.style.display =
    "none";
bioGroup.style.display = "none";
avatarGroup.style.display = "none";
    forgotGroup.style.display =
        "none";


    switchArea.style.display =
        "none";


    passwordLabel.textContent =
        "New Password";


    passwordInput.placeholder =
        "Enter your new password";


    passwordInput.value =
        "";


    submitButton.textContent =
        "Update Password";


    showMessage(
        "Enter your new password below.",
        "success"
    );

}


function showLoginForm() {

    isResetting = false;
    isSignUp = false;


    formTitle.textContent =
        "Sign In";


    emailGroup.style.display =
        "block";


    nameGroup.style.display =
        "none";
usernameGroup.style.display =
    "none";
bioGroup.style.display = "none";
avatarGroup.style.display = "none";
    forgotGroup.style.display =
        "block";


    switchArea.style.display =
        "block";


    passwordLabel.textContent =
        "Password";


    passwordInput.placeholder =
        "Minimum 6 characters";


    submitButton.textContent =
        "Sign In";

}


function updateForm() {

    if (isSignUp) {

        formTitle.textContent =
            "Create Account";

        submitButton.textContent =
            "Create Account";

        switchText.textContent =
            "Already have an account?";

        switchButton.textContent =
            "Sign In";

      nameGroup.style.display =
    "block";

usernameGroup.style.display =
    "block";
bioGroup.style.display = "block";
avatarGroup.style.display = "block";
forgotGroup.style.display =
    "none";
    } else {

        showLoginForm();

        switchText.textContent =
            "Don't have an account?";

        switchButton.textContent =
            "Create Account";

    }

    message.style.display =
        "none";

}


switchButton.addEventListener("click", () => {

    isSignUp = !isSignUp;

    updateForm();

});

/* PATRIODX ACCOUNT SWITCHER AUTH MODES */

const authParams = new URLSearchParams(
    window.location.search
);

const requestedAuthMode = authParams.get("mode");
const requestedEmail = authParams.get("email");

if (requestedEmail) {
    document.getElementById("email").value =
        requestedEmail;
}
if (requestedAuthMode === "signup") {
    isSignUp = true;
    updateForm();
} else if (requestedAuthMode === "login") {
    showLoginForm();
}
forgotButton.addEventListener("click", async () => {

    const email =
        document.getElementById("email").value.trim();


    if (!email) {

        showMessage(
            "Please enter your email address first.",
            "error"
        );

        return;

    }


    forgotButton.disabled =
        true;

    forgotButton.textContent =
        "Sending...";


    try {
const redirectUrl =
    window.location.origin +
    window.location.pathname.replace(
        "auth.html",
        "reset-password.html"
    );

        const { error } =
            await supabaseClient.auth
                .resetPasswordForEmail(
                    email,
                    {
                        redirectTo:
                            redirectUrl
                    }
                );


        if (error) {
            throw error;
        }


        showMessage(
            "Password reset email sent. Check your inbox and click the reset link.",
            "success"
        );


    } catch (error) {

        showMessage(
            error.message ||
            "Unable to send password reset email.",
            "error"
        );

    } finally {

        forgotButton.disabled =
            false;

        forgotButton.textContent =
            "Forgot Password?";

    }

});


form.addEventListener("submit", async (event) => {

    event.preventDefault();


    const email =
        document.getElementById("email")
            .value
            .trim();

    const password =
        passwordInput.value;

    const fullName =
    document.getElementById("name")
        .value
        .trim();
const username =
    usernameInput.value
        .trim()
        .toLowerCase();
const bio = bioInput.value.trim();
    submitButton.disabled =
        true;


    submitButton.textContent =
        "Please wait...";


    try {

        /* ==========================
           PASSWORD RESET
           ========================== */

        if (isResetting) {

            if (password.length < 6) {

                throw new Error(
                    "Password must be at least 6 characters."
                );

            }


            const { error } =
                await supabaseClient.auth
                    .updateUser({
                        password: password
                    });


            if (error) {
                throw error;
            }


            showMessage(
                "Password updated successfully!",
                "success"
            );


            passwordInput.value =
                "";


            setTimeout(() => {

                showLoginForm();

                document.getElementById(
                    "email"
                ).value = email;

                showMessage(
                    "Your password has been changed. You can now sign in.",
                    "success"
                );

            }, 1500);


            return;
        }


        /* ==========================
           SIGN UP
           ========================== */

        if (isSignUp) {

if (!fullName) {
    throw new Error(
        "Please enter your name."
    );
}
if (!username) {

    throw new Error(
        "Please choose a username."
    );

}

if (username.length < 3) {

    throw new Error(
        "Username must be at least 3 characters."
    );

}

if (!/^[a-z0-9_]+$/.test(username)) {

    throw new Error(
        "Username can only contain letters, numbers, and underscores."
    );

}

          const emailRedirectTo = new URL(
    "index.html",
    window.location.href
).href;

const { data, error } =
    await supabaseClient.auth.signUp({
        email: email,
        password: password,
        options: {
            emailRedirectTo: emailRedirectTo,
         data: {
    full_name: fullName,
    username: username,
    bio: bio
}
        }
    });


            if (error) {
                throw error;
            }
// Preserve the selected photo until the user signs in.
if (data.user && signupAvatarData) {
    try {
        localStorage.setItem(
            `patriodxPendingSignupProfile:${data.user.id}`,
            JSON.stringify({
                avatar: signupAvatarData,
                savedAt: Date.now()
            })
        );
    } catch (storageError) {
        console.warn(
            "Could not temporarily save signup photo:",
            storageError
        );

        showMessage(
            "Your account was created, but your photo could not be saved. You can add it from your profile after signing in.",
            "success"
        );
    }
}
if (data.user && data.session) {

    /* Save the new account identity. */
    try {
        const storageKey = "patriodxSavedAccountEmails";

        const savedEmails = JSON.parse(
            localStorage.getItem(storageKey) || "[]"
        );

        if (!savedEmails.includes(email)) {
            savedEmails.push(email);

            localStorage.setItem(
                storageKey,
                JSON.stringify(savedEmails)
            );
        }
    } catch (storageError) {
        console.warn("Could not save account identity:", storageError);
    }

    showMessage(
        "Account created successfully. Opening PATRIODX...",
        "success"
    );

    window.location.href = "index.html";

} else if (data.user) {

    showMessage(
        "Account created successfully. Please check your email to confirm your account, then sign in.",
        "success"
    );

}

return;
        }


        /* ==========================
           SIGN IN
           ========================== */

        const { data, error } =
            await supabaseClient.auth
                .signInWithPassword({

                    email: email,

                    password: password

                });


        if (error) {
            throw error;
        }


        if (!data.session) {

            throw new Error(
                "Login succeeded, but no session was created."
            );

        }
/* Save account identity, never the password. */

try {
    const storageKey = "patriodxSavedAccountEmails";

    const savedEmails = JSON.parse(
        localStorage.getItem(storageKey) || "[]"
    );

    if (!savedEmails.includes(email)) {
        savedEmails.push(email);

        localStorage.setItem(
            storageKey,
            JSON.stringify(savedEmails)
        );
    }
} catch (storageError) {
    console.warn(
        "Could not save account identity:",
        storageError
    );
}

        window.location.href =
            "index.html";


    } catch (error) {

        showMessage(
            error.message ||
            "Something went wrong.",
            "error"
        );

    } finally {

        submitButton.disabled =
            false;


        if (isResetting) {

            submitButton.textContent =
                "Update Password";

        } else {

            submitButton.textContent =
                isSignUp
                    ? "Create Account"
                    : "Sign In";

        }

    }

});


/* =====================================
   PASSWORD RECOVERY EVENT
   ===================================== */

supabaseClient.auth.onAuthStateChange(
    (event, session) => {

        console.log(
            "Supabase Auth Event:",
            event
        );


        if (event === "PASSWORD_RECOVERY") {

            showResetForm();

        }

    }
);


/* =====================================
   CHECK THE URL FOR RECOVERY FLOW
   ===================================== */

const hash =
    window.location.hash;


if (
    hash.includes("type=recovery") ||
    hash.includes("type%3Drecovery")
) {

    /*
       Give Supabase a moment to process
       the recovery session, then display
       the password form.
    */

    setTimeout(() => {

        showResetForm();

    }, 500);

}


/* =====================================
   INITIAL FORM
   ===================================== */

updateForm();

</script>

</body>
</html>
