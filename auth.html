<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PATRIODX | Sign In</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: Arial, sans-serif;
        background: #f5f7fb;
        padding: 20px;
    }

    .auth-container {
        width: 100%;
        max-width: 430px;
    }

    .brand {
        text-align: center;
        margin-bottom: 25px;
    }

    .brand img {
        width: 80px;
        height: 80px;
        object-fit: contain;
        border-radius: 18px;
        margin-bottom: 10px;
    }

    .brand h1 {
        margin: 0;
        font-size: 28px;
    }

    .brand p {
        margin-top: 8px;
        color: #666;
    }

    .auth-card {
        background: white;
        padding: 30px;
        border-radius: 18px;
        box-shadow: 0 10px 35px rgba(0,0,0,0.08);
    }

    .auth-card h2 {
        margin-top: 0;
    }

    .form-group {
        margin-bottom: 18px;
    }

    label {
        display: block;
        margin-bottom: 7px;
        font-weight: 600;
    }

    input {
        width: 100%;
        padding: 13px;
        border: 1px solid #d8dce5;
        border-radius: 10px;
        font-size: 15px;
    }

    button {
        width: 100%;
        padding: 14px;
        border: 0;
        border-radius: 10px;
        background: #111827;
        color: white;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
    }

    button:hover {
        opacity: 0.9;
    }

    .switch {
        text-align: center;
        margin-top: 20px;
        color: #666;
    }

    .switch button {
        width: auto;
        padding: 0;
        background: none;
        color: #111827;
        font-size: inherit;
    }

    #message {
        margin-bottom: 15px;
        padding: 12px;
        border-radius: 8px;
        display: none;
    }

    .success {
        background: #e8f7ed;
        color: #176b35;
    }

    .error {
        background: #fdecec;
        color: #a11a1a;
    }
</style>

</head>

<body>

<div class="auth-container">

<div class="brand">
    <img src="assets/patriodx-logo.jpeg" alt="PATRIODX">
    <h1>PATRIODX</h1>
    <p>Run your business smarter.</p>
</div>

<div class="auth-card">

    <h2 id="formTitle">Sign In</h2>

    <div id="message"></div>

    <form id="authForm">

        <div class="form-group" id="nameGroup" style="display:none;">
            <label for="name">Business Name</label>

            <input
                type="text"
                id="name"
                placeholder="Your business name"
            >
        </div>

        <div class="form-group">
            <label for="email">Email</label>

            <input
                type="email"
                id="email"
                placeholder="you@example.com"
                required
            >
        </div>

        <div class="form-group">
            <label for="password">Password</label>

            <input
                type="password"
                id="password"
                placeholder="Minimum 6 characters"
                minlength="6"
                required
            >
        </div>

        <button type="submit" id="submitButton">
            Sign In
        </button>

    </form>

    <div class="switch">
        <span id="switchText">Don't have an account?</span>

        <button type="button" id="switchButton">
            Create Account
        </button>
    </div>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
    "https://saerujjsfzyxkyacbvgr.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_l50YIYtYLXkjWE1iQSTyoA_GkrIKWn7";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


let isSignUp = false;


const form = document.getElementById("authForm");
const formTitle = document.getElementById("formTitle");
const submitButton = document.getElementById("submitButton");
const switchButton = document.getElementById("switchButton");
const switchText = document.getElementById("switchText");
const nameGroup = document.getElementById("nameGroup");
const message = document.getElementById("message");


function showMessage(text, type) {

    message.textContent = text;
    message.className = type;
    message.style.display = "block";

}


function updateForm() {

    if (isSignUp) {

        formTitle.textContent = "Create Account";
        submitButton.textContent = "Create Account";
        switchText.textContent = "Already have an account?";
        switchButton.textContent = "Sign In";
        nameGroup.style.display = "block";

    } else {

        formTitle.textContent = "Sign In";
        submitButton.textContent = "Sign In";
        switchText.textContent = "Don't have an account?";
        switchButton.textContent = "Create Account";
        nameGroup.style.display = "none";

    }

    message.style.display = "none";

}


switchButton.addEventListener("click", () => {

    isSignUp = !isSignUp;

    updateForm();

});


form.addEventListener("submit", async (event) => {

    event.preventDefault();

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;

    const businessName =
        document.getElementById("name").value.trim();


    submitButton.disabled = true;
    submitButton.textContent = "Please wait...";


    try {

        if (isSignUp) {

            if (!businessName) {

                throw new Error("Please enter your business name.");

            }


            const { data, error } =
                await supabaseClient.auth.signUp({

                    email: email,
                    password: password,

                    options: {
                        data: {
                            business_name: businessName
                        }
                    }

                });


            if (error) {
                throw error;
            }


            if (data.user) {

                showMessage(
                    "Account created successfully. Check your email if email confirmation is enabled.",
                    "success"
                );

            }

        } else {
const { data, error } =
    await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password
    });

if (error) {
    throw error;
}

if (!data.session) {
    throw new Error("Login succeeded, but no session was created.");
}

window.location.href = "index.html";

        }

    } catch (error) {

        showMessage(
            error.message || "Something went wrong.",
            "error"
        );

    } finally {

        submitButton.disabled = false;

        submitButton.textContent =
            isSignUp ? "Create Account" : "Sign In";

    }

});

</script>

</body>
</html>
